<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../dist/es-wc-spike.css">
<script defer src="../../dist/es-components.js"></script>
<script defer src="../../dist/petite-vue.iife.js"></script>
</head><body class="p-6">
<div id="app" v-scope="{ v: 0, log: [], field: {fieldname:'x', label:'X', fieldtype:'Check'} }">
  <p id="log">{{ log.join(',') }}</p>
  <es-fw-check-field id="cf" :field="field" :model-value="v" @update:model-value="v = $event.detail[0]" @change="log.push($event instanceof CustomEvent ? 'custom:' + $event.detail[0] : 'native')"></es-fw-check-field>
</div>
<script>addEventListener('DOMContentLoaded', () => PetiteVue.createApp().mount('#app'))</script>
</body></html>

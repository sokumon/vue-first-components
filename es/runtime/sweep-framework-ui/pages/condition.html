<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="/dist/es-ui.css">
<link rel="stylesheet" href="page.css">
<script src="/jquery.js"></script>
<script src="/dist/es-ui.iife.js"></script>
</head><body class="p-6">
<!-- jQuery port of wc/sweep/framework-ui/pages/condition.html -->
<pre id="state" class="text-xs"></pre>
<div id="app"></div>
<div id="desk" class="border-t mt-4 pt-4"></div>
<script>
$(function () {
  const S = window.S = { n: 0, tree: null, expr: '', log: [] }
  const show = () => { $('#state').text(JSON.stringify({ n: S.n, tree: S.tree, expr: S.expr })); $('#cb-empty .some').text(S.expr === '' ? 'none' : 'some') }
  const own = ($el, ev, fn) => $el.on(ev, function (e) { if (e.target === e.currentTarget) { fn(e.originalEvent.detail, e); show() } })
  window.own = own; window.show = show
  const $cb = $(`<es-fw-condition-builder id="c-cb" doctype="ToDo" label="Conditions" description="When should this run?">
      <span slot="empty" id="cb-empty">Start with a rule (<span class="some"></span>)</span></es-fw-condition-builder>`).prop('modelValue', S.tree)
  own($cb, 'update:modelValue', (v) => { S.tree = v })
  own($cb, 'update:expression', (v) => { S.expr = v })
  $cb.appendTo('#app')
  // attribute-only configuration (JSON attrs) for the readonly builder: the Desk "HTML string" shape
  $(`<es-fw-condition-builder id="c-cb-ro" class="mt-6 block" readonly
      fields='[{"label":"Status","fieldname":"status","fieldtype":"Select","options":"Open\\nClosed"}]'
      model-value='{"conjunction":"and","conditions":[{"fieldname":"status","operator":"equals","value":"Open"}]}'
      labels='{"empty":"Nothing yet"}'></es-fw-condition-builder>`).appendTo('#app')
  // same readonly builder configured with .prop (the reference)
  $('<es-fw-condition-builder id="c-cb-ro2" class="mt-6 block" readonly>')
    .prop({ fields: [{ label: 'Status', fieldname: 'status', fieldtype: 'Select', options: 'Open\nClosed' }], modelValue: { conjunction: 'and', conditions: [{ fieldname: 'status', operator: 'equals', value: 'Open' }] }, labels: { empty: 'Nothing yet' } })
    .appendTo('#app')
  show()
  window.READY = true
})
</script>
</body></html>
